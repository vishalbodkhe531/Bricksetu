version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bricksetu_db
    restart: always
    environment:
      POSTGRES_DB: bricksetu
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      PGTZ: Asia/Kolkata
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bricksetu"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
