<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E25822" />
      <stop offset="100%" stop-color="#9E2B0E" />
    </linearGradient>
    
    <!-- Flame Inner Gradient -->
    <linearGradient id="flame-inner" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FFD54F" />
      <stop offset="100%" stop-color="#FF9800" />
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#3D0A00" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Container Squircle Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />

  <!-- Subtle Rim Glow -->
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="8" />

  <g filter="url(#drop-shadow)">
    <!-- Brick Base Structure (Layered Foundation) -->
    <!-- Bottom Row -->
    <rect x="100" y="356" width="146" height="54" rx="12" fill="#FFFFFF" />
    <rect x="266" y="356" width="146" height="54" rx="12" fill="#FFFFFF" />
    
    <!-- Top Row -->
    <rect x="142" y="288" width="228" height="54" rx="12" fill="#FFFFFF" fill-opacity="0.95" />

    <!-- Stylized Kiln Flame -->
    <!-- Outer Flame -->
    <path d="M256 80 C256 80 340 160 340 236 C340 282 302 316 256 316 C210 316 172 282 172 236 C172 160 256 80 256 80 Z" fill="#FFFFFF" />
    
    <!-- Inner Flame Accent -->
    <path d="M256 142 C256 142 302 196 302 240 C302 268 281 290 256 290 C231 290 210 268 210 240 C210 196 256 142 256 142 Z" fill="url(#flame-inner)" />
  </g>
</svg>
